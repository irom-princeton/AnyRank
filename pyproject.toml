[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multitest"                       
version = "0.1.1"
description = "Multiple hypothesis testing for policy evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "networkx",
  "numpy",
  "nscore>=0.1.2,<0.2",
  "statistical-comparison-core>=0.2.1,<0.3",
  "sequentialized-barnard-tests>=0.0.7",
]

[project.optional-dependencies]
scripts = [
  "pandas",
  "pillow",
  "scipy",
  "tqdm",
]
dev = [
  "pytest",
  "pandas",
  "pillow",
  "scipy",
  "tqdm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
